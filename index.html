<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Six Traps - Clinic Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }
    .tab-font {
      font-family: 'Special Elite', monospace;
      letter-spacing: 0.04em;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="w-full select-none">

  <div class="w-full max-w-4xl mx-auto px-2 pt-1 pb-2">
    
    <div class="relative w-full rounded-lg overflow-hidden shadow-lg border border-slate-300 bg-slate-900">
      <img 
        id="cabinet-img"
        src="Cabinet_1.jpeg" 
        alt="Medical Filing Cabinet" 
        class="w-full h-auto block object-cover"
      />

      <div class="absolute inset-0 w-full h-full pointer-events-none">

        <button onclick="openTrap(0)" 
          class="pointer-events-auto absolute left-[21.5%] top-[54.5%] w-[16.5%] h-[9.5%] bg-amber-50/95 hover:bg-amber-100 border border-amber-300/90 rounded-sm shadow-sm flex items-center justify-center transition-all hover:scale-105 group px-1">
          <span class="tab-font text-[9px] sm:text-[11px] md:text-xs font-bold text-slate-800 text-center uppercase leading-tight group-hover:text-blue-900">1. Partnership</span>
        </button>

        <button onclick="openTrap(1)" 
          class="pointer-events-auto absolute left-[42.2%] top-[49.8%] w-[15.8%] h-[8.8%] bg-amber-50/95 hover:bg-amber-100 border border-amber-300/90 rounded-sm shadow-sm flex items-center justify-center transition-all hover:scale-105 group px-1">
          <span class="tab-font text-[9px] sm:text-[11px] md:text-xs font-bold text-slate-800 text-center uppercase leading-tight group-hover:text-blue-900">2. Q & A</span>
        </button>

        <button onclick="openTrap(2)" 
          class="pointer-events-auto absolute left-[59.5%] top-[47.2%] w-[15.8%] h-[8.8%] bg-amber-50/95 hover:bg-amber-100 border border-amber-300/90 rounded-sm shadow-sm flex items-center justify-center transition-all hover:scale-105 group px-1">
          <span class="tab-font text-[9px] sm:text-[11px] md:text-xs font-bold text-slate-800 text-center uppercase leading-tight group-hover:text-blue-900">3. Agenda</span>
        </button>

        <button onclick="openTrap(3)" 
          class="pointer-events-auto absolute left-[26.4%] top-[36.6%] w-[14%] h-[8%] bg-amber-50/95 hover:bg-amber-100 border border-amber-300/90 rounded-sm shadow-sm flex items-center justify-center transition-all hover:scale-105 group px-1">
          <span class="tab-font text-[8px] sm:text-[10px] md:text-[11px] font-bold text-slate-800 text-center uppercase leading-tight group-hover:text-blue-900">4. Experience</span>
        </button>

        <button onclick="openTrap(4)" 
          class="pointer-events-auto absolute left-[43.3%] top-[39.5%] w-[14%] h-[8%] bg-amber-50/95 hover:bg-amber-100 border border-amber-300/90 rounded-sm shadow-sm flex items-center justify-center transition-all hover:scale-105 group px-1">
          <span class="tab-font text-[8px] sm:text-[10px] md:text-[11px] font-bold text-slate-800 text-center uppercase leading-tight group-hover:text-blue-900">5. No-Fault</span>
        </button>

        <button onclick="openTrap(5)" 
          class="pointer-events-auto absolute left-[59%] top-[33.8%] w-[13.5%] h-[8%] bg-amber-50/95 hover:bg-amber-100 border border-amber-300/90 rounded-sm shadow-sm flex items-center justify-center transition-all hover:scale-105 group px-1">
          <span class="tab-font text-[8px] sm:text-[10px] md:text-[11px] font-bold text-slate-800 text-center uppercase leading-tight group-hover:text-blue-900">6. Transition</span>
        </button>
      </div>
    </div>

    <div class="mt-2 flex flex-wrap justify-center gap-1">
      <button onclick="openTrap(0)" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-[11px] font-semibold text-slate-700 shadow-xs">1. Partnership</button>
      <button onclick="openTrap(1)" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-[11px] font-semibold text-slate-700 shadow-xs">2. Q & A</button>
      <button onclick="openTrap(2)" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-[11px] font-semibold text-slate-700 shadow-xs">3. Agenda</button>
      <button onclick="openTrap(3)" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-[11px] font-semibold text-slate-700 shadow-xs">4. Experience</button>
      <button onclick="openTrap(4)" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-[11px] font-semibold text-slate-700 shadow-xs">5. No-Fault</button>
      <button onclick="openTrap(5)" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded text-[11px] font-semibold text-slate-700 shadow-xs">6. Transition</button>
    </div>
  </div>

  <div id="card-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-3">
    <div class="relative w-full max-w-sm sm:max-w-md">
      <button onclick="closeTrap()" class="absolute -top-8 right-0 text-white hover:text-amber-400 text-xs font-bold flex items-center gap-1 bg-slate-800 px-2.5 py-0.5 rounded-full border border-slate-600">
        <span>Close</span> &times;
      </button>

      <div class="perspective-1000 h-[340px] w-full cursor-pointer" onclick="flipActiveCard()">
        <div id="modal-card-inner" class="relative w-full h-full duration-500 transform-style-3d transition-transform rounded-xl shadow-2xl border border-slate-300 bg-white">
          
          <div class="absolute inset-0 w-full h-full p-4 sm:p-5 flex flex-col justify-between backface-hidden bg-white rounded-xl">
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span id="trap-tab-label" class="tab-font text-[11px] text-slate-800 font-bold bg-amber-100 px-2 py-0.5 rounded border border-amber-300"></span>
                <span class="text-[9px] font-extrabold uppercase tracking-wider text-red-600 bg-red-100 px-2 py-0.5 rounded">The Trap</span>
              </div>
              <h2 id="trap-title" class="text-base sm:text-lg font-black text-slate-900 leading-tight"></h2>
              <p id="trap-subtitle" class="text-[11px] text-slate-500 mb-2"></p>
              
              <div class="bg-red-50 border-l-3 border-red-500 p-2.5 rounded-r-md mb-2">
                <p class="text-[9px] uppercase font-bold text-red-700 tracking-wider mb-0.5">What it sounds like</p>
                <p id="trap-sound" class="text-xs italic text-slate-800 font-medium leading-snug"></p>
              </div>
              <p class="text-[11px] text-slate-600 leading-snug"><strong class="text-slate-900">The Fallout:</strong> <span id="trap-fallout"></span></p>
            </div>
            
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-blue-700 font-bold text-xs">
              <span>Click card to inspect Antidote</span>
              <span>&rarr;</span>
            </div>
          </div>

          <div class="absolute inset-0 w-full h-full p-4 sm:p-5 flex flex-col justify-between backface-hidden rotate-y-180 bg-slate-900 text-white rounded-xl">
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span id="antidote-tab-label" class="tab-font text-[11px] text-emerald-300 font-bold bg-emerald-950 px-2 py-0.5 rounded border border-emerald-600"></span>
                <span class="text-[9px] font-extrabold uppercase tracking-wider text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-500/40">Antidote</span>
              </div>
              <h2 id="antidote-title" class="text-base sm:text-lg font-black text-emerald-400 leading-tight"></h2>
              <p id="antidote-action" class="text-[11px] text-slate-300 mt-0.5 mb-2 leading-snug"></p>
              
              <div class="bg-slate-800 border-l-3 border-emerald-400 p-2.5 rounded-r-md">
                <p class="text-[9px] uppercase font-bold text-emerald-400 tracking-wider mb-0.5">Try Saying This</p>
                <p id="antidote-phrase" class="text-xs italic text-emerald-100 leading-snug font-medium"></p>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-800 flex items-center justify-between text-slate-400 font-semibold text-xs">
              <span>Click card to see Trap</span>
              <span>&larr;</span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const trapsData = [
      {
        tab: "1. PARTNERSHIP",
        name: "The Expert Trap",
        subtitle: "Stepping in with all the answers",
        sound: "What you need to do is cut out carbs after 6pm and start walking 30 minutes every morning.",
        fallout: "Reduces patient to a passive listener who nods politely, but takes zero ownership.",
        antidoteTitle: "Ask-Offer-Ask",
        antidoteAction: "Explore their ideas first. If offering advice, ask permission beforehand.",
        antidotePhrase: "You know your day-to-day routine best. What are your own thoughts on where to start?"
      },
      {
        tab: "2. Q & A",
        name: "The Q&A Trap",
        subtitle: "Rapid-fire checklist interrogation",
        sound: "How many units a week? When did it start? Have you tried patches? Does your partner smoke?",
        fallout: "Trains the patient to give short, defensive one-word answers. Destroys conversational flow.",
        antidoteTitle: "2:1 Reflection Ratio",
        antidoteAction: "Offer at least two reflections or summaries for every question asked.",
        antidotePhrase: "So managing the cravings during evening shifts has felt nearly impossible lately."
      },
      {
        tab: "3. AGENDA",
        name: "Premature Focus",
        subtitle: "Zooming in on clinician agenda",
        sound: "Your HbA1c is 68, so we need to tackle your sugar and diet today, before anything else.",
        fallout: "If the patient came in distressed about bereavement or joint pain, you lose their engagement.",
        antidoteTitle: "Agenda Mapping",
        antidoteAction: "Lay out clinical topics alongside their priorities and agree where to start.",
        antidotePhrase: "We have test results to review, but what was the top priority you hoped to discuss today?"
      },
      {
        tab: "4. EXPERIENCE",
        name: "The Labelling Trap",
        subtitle: "Slapping diagnostic categories onto patients",
        sound: "You have a real issue with non-compliance when it comes to taking your blood pressure tablets.",
        fallout: "Labels trigger defensive identity debates. The appointment becomes an argument over words.",
        antidoteTitle: "Focus on Impact, Not Labels",
        antidoteAction: "Set aside diagnostic jargon and explore lived everyday symptoms.",
        antidotePhrase: "Let's put the clinical labels aside. How is this medication actually making you feel?"
      },
      {
        tab: "5. NO-FAULT",
        name: "The Blaming Trap",
        subtitle: "Searching for fault and causality",
        sound: "How did you let your weight creep up by another two stone since October?",
        fallout: "Triggers intense shame or defensiveness. Patients retreat into sustain talk.",
        antidoteTitle: "No-Blame Framing",
        antidoteAction: "Approach lapses with objective curiosity rather than judgment.",
        antidotePhrase: "Bodies fluctuate when life gets stressful. What changes happened for you since autumn?"
      },
      {
        tab: "6. TRANSITION",
        name: "The Chat Trap",
        subtitle: "Comfortable, surface-level small talk",
        sound: "How are the grandkids? Lovely weather this week! Have you been keeping busy in the garden?",
        fallout: "Pleasant and warm, but consumes 8 minutes of a 10-minute clinic without touching change.",
        antidoteTitle: "Purposeful Redirection",
        antidoteAction: "Acknowledge the rapport briefly, then anchor straight into change talk.",
        antidotePhrase: "It is wonderful hearing about the grandkids. Let's make sure we talk about keeping your energy up with them."
      }
    ];

    let currentCardFlipped = false;

    function openTrap(index) {
      const data = trapsData[index];
      currentCardFlipped = false;
      document.getElementById('modal-card-inner').classList.remove('rotate-y-180');

      document.getElementById('trap-tab-label').innerText = data.tab;
      document.getElementById('antidote-tab-label').innerText = data.tab;
      document.getElementById('trap-title').innerText = data.name;
      document.getElementById('trap-subtitle').innerText = data.subtitle;
      document.getElementById('trap-sound').innerText = `"${data.sound}"`;
      document.getElementById('trap-fallout').innerText = data.fallout;

      document.getElementById('antidote-title').innerText = data.antidoteTitle;
      document.getElementById('antidote-action').innerText = data.antidoteAction;
      document.getElementById('antidote-phrase').innerText = `"${data.antidotePhrase}"`;

      document.getElementById('card-modal').classList.remove('hidden');
    }

    function flipActiveCard() {
      currentCardFlipped = !currentCardFlipped;
      const inner = document.getElementById('modal-card-inner');
      if (currentCardFlipped) inner.classList.add('rotate-y-180');
      else inner.classList.remove('rotate-y-180');
    }

    function closeTrap() {
      document.getElementById('card-modal').classList.add('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeTrap();
    });
    document.getElementById('card-modal').addEventListener('click', (e) => {
      if (e.target.id === 'card-modal') closeTrap();
    });
  </script>
</body>
</html>
